name: Terraform

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement à déployer'
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action à effectuer'
        required: true
        type: choice
        options:
          - apply
          - destroy

env:
  TF_VERSION: '1.14.0'

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    needs: init
    if: (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: Déterminer l'environnement
        id: set_env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      - run: terraform init -backend-config="bucket=storage-fmt" -backend-config="prefix=storage-fmt-${{ steps.set_env.outputs.environment }}"
      - run: terraform plan -var-file=envs/${{ steps.set_env.outputs.environment }}/terraform.tfvars -out=plan
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ steps.set_env.outputs.environment }}
          path: plan

  apply:
    needs: plan
    if: (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: Déterminer l'environnement
        id: set_env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ steps.set_env.outputs.environment }}
      - run: terraform init -backend-config="bucket=storage-fmt" -backend-config="prefix=storage-fmt-${{ steps.set_env.outputs.environment }}"
      - run: terraform apply -auto-approve plan
      - name: Récupérer les outputs Terraform
        run: terraform output -json > terraform_outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ steps.set_env.outputs.environment }}
          path: terraform_outputs.json

  ansible:
    needs: apply
    if: (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Déterminer l'environnement
        id: set_env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      - uses: actions/download-artifact@v4
        with:
          name: terraform-outputs-${{ steps.set_env.outputs.environment }}
          path: .
      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/ansible_key
          chmod 600 ~/.ssh/ansible_key
          ssh-keygen -y -f ~/.ssh/ansible_key > /dev/null 2>&1 || (echo "Clé privée invalide" && exit 1)
          if [ -f terraform_outputs.json ]; then
            FIRST_IP=$(jq -r '.vm_external_ips.value[0] // empty' terraform_outputs.json)
            [ -n "$FIRST_IP" ] && [ "$FIRST_IP" != "null" ] && ssh-keyscan -H "$FIRST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
      - name: Installer Python et Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip > /dev/null 2>&1
          pip3 install ansible > /dev/null 2>&1
      - name: Générer l'inventaire dynamique
        run: |
          cd ansible
          python3 scripts/generate_inventory.py ../terraform_outputs.json ${{ steps.set_env.outputs.environment }} > inventory.json 2>/dev/null
        env:
          ANSIBLE_SSH_KEY_PATH: ~/.ssh/ansible_key
      - name: Attendre que les VMs soient prêtes
        run: |
          sleep 60
          FIRST_IP=$(jq -r '.vm_external_ips.value[0] // empty' terraform_outputs.json)
          [ -n "$FIRST_IP" ] && [ "$FIRST_IP" != "null" ] && timeout 30 bash -c 'until ssh -i ~/.ssh/ansible_key -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ansible@'"$FIRST_IP"' echo "OK" 2>/dev/null; do sleep 10; done' || true
      - name: Exécuter le playbook Ansible
        run: |
          cd ansible
          export ANSIBLE_CONFIG=$PWD/Ansible.cfg
          export ANSIBLE_ROLES_PATH=${{ github.workspace }}/ansible/Roles
          echo "=== Vérification des rôles ==="
          ls -la Roles/Common/Tasks/
          ls -la Roles/Webservers/Tasks/
          echo "=== Liste des tâches ==="
          ansible-playbook -i inventory.json Playbooks/Deploy_web.yml --list-tasks
          echo "=== Exécution du playbook ==="
          ansible-playbook -i inventory.json Playbooks/Deploy_web.yml
        env:
          ANSIBLE_SSH_KEY_PATH: ~/.ssh/ansible_key
          ANSIBLE_HOST_KEY_CHECKING: "False"
      - name: Exécuter les tests
        run: |
          cd ansible
          export ANSIBLE_CONFIG=$PWD/Ansible.cfg
          export ANSIBLE_ROLES_PATH=${{ github.workspace }}/ansible/Roles
          ansible-playbook -i inventory.json Playbooks/Tests/test_nginx.yml
        env:
          ANSIBLE_SSH_KEY_PATH: ~/.ssh/ansible_key
          ANSIBLE_HOST_KEY_CHECKING: "False"

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - run: terraform init -backend-config="bucket=storage-fmt" -backend-config="prefix=storage-fmt-${{ inputs.environment }}"
      - run: terraform destroy -var-file=envs/${{ inputs.environment }}/terraform.tfvars -auto-approve
