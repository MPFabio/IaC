name: Terraform

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TF_VERSION: '1.14.0'

jobs:
  init:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform -chdir=envs/${{ matrix.env }} init -backend=false
      - run: terraform -chdir=envs/${{ matrix.env }} validate

  plan:
    needs: init
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - run: terraform -chdir=envs/${{ matrix.env }} init
      - run: terraform -chdir=envs/${{ matrix.env }} plan -out=plan
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.env }}
          path: envs/${{ matrix.env }}/plan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ matrix.env }}
          path: envs/${{ matrix.env }}
      - run: terraform -chdir=envs/${{ matrix.env }} init
      - run: terraform -chdir=envs/${{ matrix.env }} apply -auto-approve plan
