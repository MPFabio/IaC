name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement a deployer'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  TF_VERSION: '1.14.0'

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - run: terraform init -backend-config="bucket=tfstate-fmt-${{ inputs.environment }}"
      - run: terraform plan -var-file=envs/${{ inputs.environment }}/terraform.tfvars -out=plan
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.environment }}
          path: plan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.environment }}
      - run: terraform init -backend-config="bucket=tfstate-fmt-${{ inputs.environment }}"
      - run: terraform apply -auto-approve plan
