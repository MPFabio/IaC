name: Terraform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement a deployer'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  TF_VERSION: '1.14.0'

jobs:
  check-commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.check.outputs.environment }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check commit message
        id: check
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"
          if [[ "$MESSAGE" == *"[null]"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Pipeline ignore (commit contient [null])"
          elif [[ "$MESSAGE" == *"[dev]"* ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Environnement detecte: dev"
          elif [[ "$MESSAGE" == *"[prod]"* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Environnement detecte: prod"
          else
            echo "ERREUR: Le commit doit contenir [dev], [prod] ou [null]"
            echo ""
            echo "Exemple: git commit -m 'feat: update config [dev]'"
            echo "Exemple: git commit -m 'fix: correction [prod]'"
            echo "Exemple: git commit -m 'docs: readme [null]'"
            exit 1
          fi

  init:
    runs-on: ubuntu-latest
    needs: check-commit
    if: always() && ((needs.check-commit.result == 'success' && needs.check-commit.outputs.skip != 'true') || github.event_name == 'workflow_dispatch')
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "environment=${{ needs.check-commit.outputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    needs: init
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ needs.init.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - run: terraform init -backend-config="bucket=tfstate-fmt-${{ env.ENVIRONMENT }}"
      - run: terraform plan -var-file=envs/${{ env.ENVIRONMENT }}/terraform.tfvars -out=plan
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ env.ENVIRONMENT }}
          path: plan

  apply:
    needs: [init, plan]
    runs-on: ubuntu-latest
    environment: ${{ needs.init.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.init.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ env.ENVIRONMENT }}
      - run: terraform init -backend-config="bucket=tfstate-fmt-${{ env.ENVIRONMENT }}"
      - run: terraform apply -auto-approve plan