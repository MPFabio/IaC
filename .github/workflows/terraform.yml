name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement à déployer'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  TF_VERSION: '1.14.0'
  BACKEND_BUCKET: tfstate-fmt-${{ inputs.environment }}

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform -chdir=envs/${{ inputs.environment }} init -backend-config="bucket=${{ env.BACKEND_BUCKET }}"
      - run: terraform -chdir=envs/${{ inputs.environment }} validate

  plan:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - run: terraform -chdir=envs/${{ inputs.environment }} init -backend-config="bucket=${{ env.BACKEND_BUCKET }}"
      - run: terraform -chdir=envs/${{ inputs.environment }} plan -var-file=terraform.tfvars -out=plan
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.environment }}
          path: envs/${{ inputs.environment }}/plan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.environment }}
          path: envs/${{ inputs.environment }}
      - run: terraform -chdir=envs/${{ inputs.environment }} init -backend-config="bucket=${{ env.BACKEND_BUCKET }}"
      - run: terraform -chdir=envs/${{ inputs.environment }} apply -auto-approve plan
