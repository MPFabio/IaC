name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement à détruire'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  TF_VERSION: '1.14.0'

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: Vérifier le state dans GCS
        run: |
          echo "=== Vérification du state dans le bucket ==="
          echo "Recherche dans: gs://storage-fmt/storage-fmt-${{ inputs.environment }}/"
          gsutil ls gs://storage-fmt/storage-fmt-${{ inputs.environment }}/ 2>&1 || echo "Le dossier storage-fmt-${{ inputs.environment }}/ n'existe pas"
          echo ""
          echo "Recherche dans: gs://storage-fmt/${{ inputs.environment }}/ (ancien format)"
          gsutil ls gs://storage-fmt/${{ inputs.environment }}/ 2>&1 || echo "Le dossier ${{ inputs.environment }}/ n'existe pas"
          echo ""
          echo "Liste de tous les dossiers dans le bucket:"
          gsutil ls gs://storage-fmt/ 2>&1 || echo "Impossible de lister le bucket"
      - name: Initialiser Terraform
        run: terraform init -backend-config="bucket=storage-fmt" -backend-config="prefix=storage-fmt-${{ inputs.environment }}"
      - name: Vérifier le state Terraform
        run: |
          echo "=== Vérification du state ==="
          terraform state list || echo "Aucun state trouvé ou state vide"
          echo "=== Nombre de ressources dans le state ==="
          terraform state list | wc -l || echo "0"
          echo "=== Afficher les ressources ==="
          terraform show -json | jq '.values.root_module.resources[]?.address // empty' || echo "Aucune ressource"
      - name: Détruire l'infrastructure
        run: terraform destroy -var-file=envs/${{ inputs.environment }}/terraform.tfvars -auto-approve
