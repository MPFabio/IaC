---
- name: Installer nginx sur les webservers
  hosts: webservers
  become: yes

  vars:
    nginx_port: 80
    nginx_server_name: "{{ ansible_hostname }}"

  tasks:
    - name: Installer les paquets de base et nginx
      apt:
        name:
          - curl
          - wget
          - nginx
        state: present
        update_cache: yes

    - name: Démarrer et activer nginx
      systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Déployer la configuration nginx
      template:
        src: ../Roles/Webservers/Templates/default.conf.j2
        dest: /etc/nginx/sites-available/default
        backup: yes
      notify: restart nginx

    - name: S'assurer que le site est activé
      file:
        src: /etc/nginx/sites-available/default
        dest: /etc/nginx/sites-enabled/default
        state: link

    - name: Déployer la page d'accueil
      template:
        src: ../Roles/Webservers/Templates/index.html.j2
        dest: /usr/share/nginx/html/index.html
        mode: '0644'

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
