---
- name: Tests nginx
  hosts: webservers
  become: yes

  tasks:
    - name: Vérifier que nginx est installé et actif
      systemd:
        name: nginx
      register: nginx_status
      failed_when: false

    - name: Afficher le statut
      debug:
        msg: "Nginx: {{ 'Actif' if nginx_status.status.ActiveState == 'active' else 'Inactif' }}"

    - name: Vérifier que nginx est actif
      assert:
        that:
          - nginx_status.status.ActiveState == "active"
        fail_msg: "nginx n'est pas actif. État: {{ nginx_status.status.ActiveState | default('service non trouvé') }}"






