---
- name: Installer nginx
  apt:
    name: nginx
    state: present
    update_cache: yes
  become: yes

- name: Démarrer et activer nginx avec la configuration par défaut
  systemd:
    name: nginx
    enabled: yes
    state: started
  become: yes

- name: Déployer la configuration nginx
  template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/default
    backup: yes
  become: yes

- name: Vérifier la configuration nginx avant redémarrage
  command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0
  become: yes

- name: Afficher le résultat du test de configuration
  debug:
    msg: "Configuration nginx valide: {{ nginx_test.stdout_lines }}"

- name: Redémarrer nginx avec la nouvelle configuration
  systemd:
    name: nginx
    state: restarted
  become: yes

- name: Déployer la page d'accueil stylée
  template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
    mode: '0644'
  become: yes

- name: Attendre que nginx soit complètement démarré
  wait_for:
    port: 80
    host: "{{ ansible_default_ipv4.address }}"
    delay: 2
    timeout: 10
  become: no
  ignore_errors: yes
