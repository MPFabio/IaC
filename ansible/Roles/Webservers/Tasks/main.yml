---
- name: Installer nginx
  apt:
    name: nginx
    state: present
    update_cache: yes
  become: yes

- name: Vérifier que nginx est installé
  command: which nginx
  register: nginx_which
  changed_when: false
  failed_when: nginx_which.rc != 0
  become: yes

- name: Recharger systemd pour détecter les nouveaux services
  systemd:
    daemon_reload: yes
  become: yes

- name: Vérifier que le service nginx existe
  command: systemctl list-unit-files | grep nginx
  register: nginx_service_check
  changed_when: false
  failed_when: false
  become: yes

- name: Vérifier l'existence du fichier de service systemd
  stat:
    path: /lib/systemd/system/nginx.service
  register: nginx_service_file
  become: yes

- name: Afficher les informations de diagnostic
  debug:
    msg:
      - "Services nginx trouvés: {{ nginx_service_check.stdout | default('aucun') }}"
      - "Fichier de service existe: {{ nginx_service_file.stat.exists | default(false) }}"
      - "Chemin nginx: {{ nginx_which.stdout }}"

- name: Vérifier le statut du service nginx avant démarrage
  systemd:
    name: nginx
  register: nginx_status_before
  failed_when: false
  become: yes

- name: Afficher le statut avant démarrage
  debug:
    msg: "État nginx avant démarrage: {{ nginx_status_before.status.ActiveState | default('non trouvé') }}"

- name: Démarrer et activer nginx (configuration par défaut)
  systemd:
    name: nginx
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes

- name: Vérifier que nginx est démarré après installation
  systemd:
    name: nginx
  register: nginx_status_after_install
  become: yes

- name: Afficher le statut après démarrage
  debug:
    msg: "État nginx après démarrage: {{ nginx_status_after_install.status.ActiveState | default('non trouvé') }}, LoadState: {{ nginx_status_after_install.status.LoadState | default('non trouvé') }}"

- name: Vérifier que nginx est actif
  assert:
    that:
      - nginx_status_after_install.status.ActiveState == "active"
    fail_msg: "nginx n'est pas actif après installation. État: {{ nginx_status_after_install.status.ActiveState | default('non trouvé') }}, LoadState: {{ nginx_status_after_install.status.LoadState | default('non trouvé') }}"

- name: Déployer la configuration nginx
  template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/default
    backup: yes
  become: yes

- name: Vérifier la configuration nginx avant redémarrage
  command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0
  become: yes

- name: Afficher le résultat du test de configuration
  debug:
    msg: "Configuration nginx valide: {{ nginx_test.stdout_lines }}"

- name: Redémarrer nginx avec la nouvelle configuration
  systemd:
    name: nginx
    state: restarted
  become: yes

- name: Déployer la page d'accueil stylée
  template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
    mode: '0644'
  become: yes

- name: Attendre que nginx soit complètement démarré
  wait_for:
    port: 80
    host: "{{ ansible_default_ipv4.address }}"
    delay: 2
    timeout: 10
  become: no
  ignore_errors: yes

- name: Vérifier le statut final de nginx
  systemd:
    name: nginx
  register: nginx_final_status
  become: yes

- name: Afficher le statut de nginx
  debug:
    msg: "État nginx: {{ nginx_final_status.status.ActiveState }}, Sous-état: {{ nginx_final_status.status.SubState }}"

- name: Afficher les logs nginx en cas d'erreur
  command: journalctl -u nginx -n 20 --no-pager
  register: nginx_logs
  changed_when: false
  failed_when: false
  become: yes
  when: nginx_final_status.status.ActiveState != "active"

- name: Afficher les logs si nginx n'est pas actif
  debug:
    var: nginx_logs.stdout_lines
  when: nginx_final_status.status.ActiveState != "active"

- name: S'assurer que nginx est actif
  systemd:
    name: nginx
    state: started
  become: yes
  failed_when: false
