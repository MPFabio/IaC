---
- name: Installer nginx
  apt:
    name: nginx
    state: present
    update_cache: yes
  become: yes

- name: Démarrer et activer nginx avec la configuration par défaut
  systemd:
    name: nginx
    enabled: yes
    state: started
  become: yes
  register: nginx_start_initial
  ignore_errors: yes

- name: Vérifier que nginx est démarré après installation
  systemd:
    name: nginx
  register: nginx_status_initial
  become: yes

- name: Afficher le statut initial de nginx
  debug:
    msg: "État nginx après installation: {{ nginx_status_initial.status.ActiveState | default('non trouvé') }}, LoadState: {{ nginx_status_initial.status.LoadState | default('non trouvé') }}"

- name: Vérifier la configuration nginx par défaut
  command: nginx -t
  register: nginx_test_default
  changed_when: false
  failed_when: false
  become: yes

- name: Afficher le résultat du test de configuration par défaut
  debug:
    msg: "Test configuration par défaut: {{ nginx_test_default.stdout_lines | default('Erreur') }}"
  when: nginx_test_default.rc != 0

- name: Afficher les logs nginx
  command: journalctl -u nginx -n 20 --no-pager || systemctl status nginx || echo "Service non trouvé"
  register: nginx_logs_initial
  changed_when: false
  failed_when: false
  become: yes
  when: nginx_status_initial.status.ActiveState != "active"

- name: Afficher les logs si nginx n'est pas actif
  debug:
    var: nginx_logs_initial.stdout_lines
  when: nginx_status_initial.status.ActiveState != "active"

- name: Essayer de démarrer nginx manuellement si systemd échoue
  command: nginx
  become: yes
  when: nginx_status_initial.status.ActiveState != "active"
  register: nginx_manual_start
  changed_when: false
  failed_when: false

- name: Vérifier si nginx est en cours d'exécution après démarrage manuel
  command: pgrep -x nginx || echo "Nginx n'est pas en cours d'exécution"
  register: nginx_process_check
  changed_when: false
  failed_when: false
  become: yes
  when: nginx_status_initial.status.ActiveState != "active"

- name: Afficher le résultat du démarrage manuel
  debug:
    msg: "Processus nginx après démarrage manuel: {{ nginx_process_check.stdout }}"
  when: nginx_status_initial.status.ActiveState != "active"

- name: S'assurer que le site par défaut est activé
  file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  become: yes

- name: Déployer la configuration nginx
  template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/default
    backup: yes
  become: yes

- name: S'assurer que le site reste activé après déploiement
  file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  become: yes

- name: Vérifier la configuration nginx avant redémarrage
  command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0
  become: yes

- name: Afficher le résultat du test de configuration
  debug:
    msg: "Configuration nginx valide: {{ nginx_test.stdout_lines }}"

- name: Redémarrer nginx avec la nouvelle configuration
  systemd:
    name: nginx
    state: restarted
  become: yes

- name: Vérifier que nginx est actif après redémarrage
  systemd:
    name: nginx
  register: nginx_status_after_restart
  become: yes

- name: Afficher le statut de nginx
  debug:
    msg: "État nginx après redémarrage: {{ nginx_status_after_restart.status.ActiveState | default('non trouvé') }}"

- name: S'assurer que nginx est démarré
  systemd:
    name: nginx
    state: started
  become: yes
  when: nginx_status_after_restart.status.ActiveState != "active"

- name: Déployer la page d'accueil stylée
  template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
    mode: '0644'
  become: yes

- name: Attendre que nginx soit complètement démarré
  wait_for:
    port: 80
    host: "{{ ansible_default_ipv4.address }}"
    delay: 2
    timeout: 10
  become: no
  ignore_errors: yes
