---
- name: Installer nginx
  apt:
    name: nginx
    state: present
    update_cache: yes
  become: yes

- name: Déployer la configuration nginx
  template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/default
  become: yes
  notify: restart nginx

- name: Démarrer et activer nginx
  systemd:
    name: nginx
    enabled: yes
    state: started
  become: yes
  register: nginx_start_result

- name: Vérifier que nginx est démarré
  systemd:
    name: nginx
  register: nginx_final_status
  failed_when: false

- name: Afficher le statut de nginx
  debug:
    msg: "État de nginx: {{ nginx_final_status.status.ActiveState | default('inconnu') }}"
